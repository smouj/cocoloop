name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run model tests
        run: node tests/model_test.mjs
      - name: Run bridge tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build ZIP
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix=cocoloop-cl-studio/ -o "dist/cocoloop-cl-studio-${VERSION}.zip" HEAD
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
