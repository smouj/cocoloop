name: Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build sidecar executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop\resources\server | Out-Null
          $icon = (Resolve-Path app\assets\cocoloop.ico).Path
          python -m PyInstaller --noconfirm --clean --onefile --name cocoloop-server --icon $icon --distpath desktop\resources\server --workpath .build\server --specpath .build server.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m PyInstaller --noconfirm --clean --onefile --name cocoloop-mcp --icon $icon --paths bridge --distpath desktop\resources\server --workpath .build\mcp --specpath .build bridge\mcp_server.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m PyInstaller --noconfirm --clean --onefile --name cocoloop-cli --icon $icon --paths bridge --distpath desktop\resources\server --workpath .build\cli --specpath .build bridge\clctl.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build installer
        working-directory: desktop
        run: |
          npm ci
          npm run dist
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop\dist\CocoLoop-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash)  $($installer.Name)" | Out-File -Encoding ascii desktop\dist\SHA256SUMS-desktop.txt
          Get-Content desktop\dist\SHA256SUMS-desktop.txt
      - uses: actions/upload-artifact@v7
        with:
          name: cocoloop-windows-installer
          path: |
            desktop/dist/CocoLoop-Setup-*.exe
            desktop/dist/*.blockmap
            desktop/dist/SHA256SUMS-desktop.txt
          if-no-files-found: error
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/CocoLoop-Setup-*.exe
            desktop/dist/*.blockmap
            desktop/dist/SHA256SUMS-desktop.txt
